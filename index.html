<body>
  <div id="root"></div>
  <noscript>This application requires JavaScript.</noscript>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script type="text/babel" data-presets="typescript,react" data-filename="teacher-record-console.tsx">
const { useEffect, useMemo, useRef, useState } = React;
type SchoolYear = { id: string; label: string; archived?: boolean };
type Course = { id: string; yearId: string; name: string; archived?: boolean };
type Section = { id: string; courseId: string; name: string; archived?: boolean };
type Student = { id: string; firstName: string; lastName: string; email: string; archived?: boolean; createdAt: string };
type Enrollment = { id: string; studentId: string; sectionId: string; startDate: string; endDate?: string; active: boolean };
type RecordKind = "teacher-note" | "official-note" | "writing" | "discussion" | "family" | "conference" | "strength" | "other";
type StudentRecord = { id: string; studentId: string; enrollmentId?: string; date: string; kind: RecordKind; title?: string; text: string; studentFacing: boolean; pinned: boolean; createdAt: string; updatedAt: string };
type Theme = "holographic" | "frontierSteel" | "samuraiKintsugi" | "victorianAether" | "artDeco" | "noirTerminal" | "solarTemple" | "deepSea" | "starshipConsole" | "astrometrics" | "imperialDatapad" | "jediArchive" | "cyberpunkArcade" | "auroraGlass" | "obsidianLab" | "brassObservatory" | "volcanicCore" | "arcticCommand";
type AppData = { format: string; schemaVersion: number; updatedAt: string; years: SchoolYear[]; courses: Course[]; sections: Section[]; students: Student[]; enrollments: Enrollment[]; records: StudentRecord[]; settings: { theme: Theme } };
type Modal = null | "student" | "record" | "move" | "structure" | "export" | "data" | "themes" | "confirm";

const kinds: { id: RecordKind; label: string; short: string }[] = [
  { id: "teacher-note", label: "Teacher note", short: "Note" },
  { id: "official-note", label: "Official note", short: "Official" },
  { id: "writing", label: "Writing feedback", short: "Writing" },
  { id: "discussion", label: "Discussion feedback", short: "Discussion" },
  { id: "family", label: "Family communication", short: "Family" },
  { id: "conference", label: "Conference note", short: "Conference" },
  { id: "strength", label: "Celebration / strength", short: "Strength" },
  { id: "other", label: "Other", short: "Other" },
];

const themes: { id: Theme; label: string; sub: string }[] = [
  { id: "holographic", label: "Holographic", sub: "Blue glass and cockpit light" },
  { id: "frontierSteel", label: "Frontier Steel", sub: "Silver metal with amber edge" },
  { id: "samuraiKintsugi", label: "Samurai Kintsugi", sub: "Ink, lacquer, and gold repair" },
  { id: "victorianAether", label: "Victorian Aether", sub: "Burgundy and polished metal" },
  { id: "artDeco", label: "Art Deco Observatory", sub: "Teal glass and brass geometry" },
  { id: "noirTerminal", label: "Noir Terminal", sub: "Green phosphor and dark chrome" },
  { id: "solarTemple", label: "Solar Temple", sub: "Bronze, turquoise, and stone" },
  { id: "deepSea", label: "Deep Sea Console", sub: "Abyssal glass and aged brass" },
  { id: "starshipConsole", label: "Starship Console", sub: "Amber and slate command glass" },
  { id: "astrometrics", label: "Astrometrics", sub: "Star-map blue and silver light" },
  { id: "imperialDatapad", label: "Imperial Datapad", sub: "Black steel and red status light" },
  { id: "jediArchive", label: "Jedi Archive", sub: "Archive brass and library blue" },
  { id: "cyberpunkArcade", label: "Cyberpunk Arcade", sub: "Cyan neon and violet edge" },
  { id: "auroraGlass", label: "Aurora Glass", sub: "Green-violet frosted glass" },
  { id: "obsidianLab", label: "Obsidian Lab", sub: "Black glass and acid green" },
  { id: "brassObservatory", label: "Brass Observatory", sub: "Navy star maps and brass" },
  { id: "volcanicCore", label: "Volcanic Core", sub: "Charcoal and ember light" },
  { id: "arcticCommand", label: "Arctic Command", sub: "Frosted slate and silver-blue" },
];

const isoDate = () => new Date().toISOString().slice(0, 10);
const stamp = () => new Date().toISOString();
const uid = (prefix: string) => `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
const defaultData = (): AppData => {
  const yearId = uid("yr"), courseId = uid("crs"), sectionA = uid("sec"), sectionB = uid("sec");
  return {
    format: "teacher-records-backup", schemaVersion: 1, updatedAt: stamp(),
    years: [{ id: yearId, label: "2026â€“2027" }],
    courses: [{ id: courseId, yearId, name: "English 10" }],
    sections: [{ id: sectionA, courseId, name: "Block A" }, { id: sectionB, courseId, name: "Block B" }],
    students: [], enrollments: [], records: [], settings: { theme: "holographic" },
  };
};

const dbName = "teacher-records-console";
function loadDb(): Promise<AppData | null> {
  return new Promise((resolve) => {
    const req = indexedDB.open(dbName, 1);
    req.onupgradeneeded = () => req.result.createObjectStore("state");
    req.onerror = () => resolve(null);
    req.onsuccess = () => {
      const get = req.result.transaction("state", "readonly").objectStore("state").get("app");
      get.onsuccess = () => resolve((get.result as AppData) || null);
      get.onerror = () => resolve(null);
    };
  });
}
function saveDb(data: AppData) {
  const req = indexedDB.open(dbName, 1);
  req.onupgradeneeded = () => req.result.createObjectStore("state");
  req.onsuccess = () => req.result.transaction("state", "readwrite").objectStore("state").put(data, "app");
}

function fullName(s?: Student) { return s ? `${s.firstName} ${s.lastName}`.trim() : "Student"; }
function prettyDate(date: string) { return new Date(`${date}T12:00:00`).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }
function kindLabel(kind: RecordKind) { return kinds.find(k => k.id === kind)?.label || "Record"; }

function Home() {
  const [data, setData] = useState<AppData | null>(null);
  const [yearId, setYearId] = useState("");
  const [courseId, setCourseId] = useState("");
  const [sectionId, setSectionId] = useState("");
  const [studentId, setStudentId] = useState("");
  const [selectedIds, setSelectedIds] = useState<string[]>([]);
  const [modal, setModal] = useState<Modal>(null);
  const [search, setSearch] = useState("");
  const [recordSearch, setRecordSearch] = useState("");
  const [historyScope, setHistoryScope] = useState<"year" | "all">("year");
  const [kindFilter, setKindFilter] = useState<RecordKind | "all">("all");
  const [privacy, setPrivacy] = useState(false);
  const [showArchived, setShowArchived] = useState(false);
  const [toast, setToast] = useState("");
  const [loaded, setLoaded] = useState(false);
  const toastTimer = useRef<ReturnType<typeof setTimeout> | null>(null);

  useEffect(() => { loadDb().then(x => { setData(x || defaultData()); setLoaded(true); }); }, []);
  useEffect(() => {
    if (!data || !loaded) return;
    const next = { ...data, updatedAt: stamp() };
    saveDb(next);
  }, [data, loaded]);
  useEffect(() => {
    if (!data) return;
    const y = data.years.find(x => x.id === yearId) || data.years.find(x => !x.archived) || data.years[0];
    if (y && y.id !== yearId) setYearId(y.id);
    const c = data.courses.find(x => x.id === courseId && x.yearId === y?.id) || data.courses.find(x => x.yearId === y?.id && !x.archived);
    if (c && c.id !== courseId) setCourseId(c.id);
    const s = data.sections.find(x => x.id === sectionId && x.courseId === c?.id) || data.sections.find(x => x.courseId === c?.id && !x.archived);
    if (s && s.id !== sectionId) setSectionId(s.id);
  }, [data, yearId, courseId, sectionId]);

  const notify = (message: string) => {
    setToast(message); if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2600);
  };
  const update = (fn: (d: AppData) => AppData) => setData(d => d ? fn(d) : d);
  const currentYear = data?.years.find(y => y.id === yearId);
  const currentCourse = data?.courses.find(c => c.id === courseId);
  const currentSection = data?.sections.find(s => s.id === sectionId);
  const selectedStudent = data?.students.find(s => s.id === studentId);
  const sectionEnrollments = useMemo(() => data?.enrollments.filter(e => e.sectionId === sectionId && e.active) || [], [data, sectionId]);
  const roster = useMemo(() => {
    if (!data) return [];
    const ids = new Set(sectionEnrollments.map(e => e.studentId));
    const q = search.trim().toLowerCase();
    return data.students.filter(s => ids.has(s.id) && (showArchived || !s.archived) && (!q || fullName(s).toLowerCase().includes(q) || s.email.toLowerCase().includes(q)))
      .sort((a, b) => a.lastName.localeCompare(b.lastName) || a.firstName.localeCompare(b.firstName));
  }, [data, sectionEnrollments, search, showArchived]);
  useEffect(() => { if (roster.length && !roster.some(s => s.id === studentId)) setStudentId(roster[0].id); if (!roster.length) setStudentId(""); }, [roster, studentId]);

  const studentRecords = useMemo(() => {
    if (!data || !studentId) return [];
    const yearStudentEnrollmentIds = new Set(data.enrollments.filter(e => e.studentId === studentId && data.sections.some(s => s.id === e.sectionId && data.courses.some(c => c.id === s.courseId && c.yearId === yearId))).map(e => e.id));
    const q = recordSearch.toLowerCase().trim();
    return data.records.filter(r => r.studentId === studentId)
      .filter(r => historyScope === "all" || (r.enrollmentId && yearStudentEnrollmentIds.has(r.enrollmentId)))
      .filter(r => kindFilter === "all" || r.kind === kindFilter)
      .filter(r => !q || r.text.toLowerCase().includes(q) || r.title?.toLowerCase().includes(q))
      .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
  }, [data, studentId, yearId, historyScope, kindFilter, recordSearch]);

  if (!data) return <main className="loading"><div className="loaderCore">INITIALIZING ARCHIVE</div></main>;

  const activeTheme = data.settings.theme;
  const toggleSelected = (id: string) => setSelectedIds(x => x.includes(id) ? x.filter(v => v !== id) : [...x, id]);
  const copy = async (text: string, message: string) => { await navigator.clipboard.writeText(text); notify(message); };
  const emailIds = selectedIds.length ? selectedIds : roster.map(s => s.id);
  const copyEmails = () => {
    const emails = Array.from(new Set(data.students.filter(s => emailIds.includes(s.id)).map(s => s.email.trim()).filter(e => /^\S+@\S+\.\S+$/.test(e))));
    if (!emails.length) return notify("No valid email addresses selected");
    copy(emails.join("; "), `${emails.length} email address${emails.length === 1 ? "" : "es"} copied`);
  };

  return (
    <main className={`app theme-${activeTheme} ${privacy ? "privacy-on" : ""}`}>
      <div className="atmosphere" aria-hidden="true" />
      <header className="topbar">
        <div className="brand">
          <span className="eyebrow">LONGITUDINAL STUDENT ARCHIVE</span>
          <h1>Teacher Record Console</h1>
          <span className="local-status"><i /> Stored on this device</span>
        </div>
        <nav className="top-actions" aria-label="Application controls">
          <button className="btn ghost" onClick={() => setModal("export")}>â‡§ Export</button>
          <button className="btn ghost" onClick={() => setModal("data")}>â–£ Data</button>
          <button className="btn ghost icon-btn" onClick={() => setModal("themes")} title="Choose skin" aria-label="Choose skin">âœ¦</button>
          <button className={`btn ghost icon-btn ${privacy ? "on" : ""}`} onClick={() => setPrivacy(x => !x)} title="Privacy screen" aria-label="Toggle privacy screen">{privacy ? "â—‰" : "â—Ž"}</button>
        </nav>
      </header>

      <section className="context-bar glass">
        <div className="context-select"><label>School year</label><select value={yearId} onChange={e => { setYearId(e.target.value); setSelectedIds([]); }}>{data.years.filter(y => !y.archived).map(y => <option key={y.id} value={y.id}>{y.label}</option>)}</select></div>
        <div className="context-select"><label>Class</label><select value={courseId} onChange={e => { setCourseId(e.target.value); setSelectedIds([]); }}>{data.courses.filter(c => c.yearId === yearId && !c.archived).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
        <div className="section-tabs" role="tablist" aria-label="Sections">
          {data.sections.filter(s => s.courseId === courseId && !s.archived).map(s => <button key={s.id} className={s.id === sectionId ? "active" : ""} onClick={() => { setSectionId(s.id); setSelectedIds([]); }}>{s.name}<small>{data.enrollments.filter(e => e.sectionId === s.id && e.active).length}</small></button>)}
        </div>
        <button className="btn ghost manage-btn" onClick={() => setModal("structure")}>Manage classes</button>
      </section>

      <section className="workspace">
        <aside className="roster-panel glass">
          <div className="panel-head">
            <div><span className="eyebrow">ACTIVE ROSTER</span><h2>{currentSection?.name || "Section"}</h2></div>
            <button className="btn primary compact" onClick={() => setModal("student")}>+ Student</button>
          </div>
          <div className="searchbox"><span>âŒ•</span><input value={search} onChange={e => setSearch(e.target.value)} placeholder="Find a studentâ€¦" /></div>
          <div className="bulk-strip">
            <label className="check-label"><input type="checkbox" checked={!!roster.length && roster.every(s => selectedIds.includes(s.id))} onChange={e => setSelectedIds(e.target.checked ? roster.map(s => s.id) : [])} /> {selectedIds.length ? `${selectedIds.length} selected` : "Select all"}</label>
            <div><button onClick={copyEmails} title="Copy semicolon-separated email list">@ Emails</button>{selectedIds.length > 0 && <button onClick={() => setModal("move")}>â‡„ Move</button>}</div>
          </div>
          <div className="roster-list">
            {!roster.length && <EmptyRoster onAdd={() => setModal("student")} />}
            {roster.map(s => {
              const count = data.records.filter(r => r.studentId === s.id).length;
              return <article key={s.id} className={`student-row ${s.id === studentId ? "active" : ""} ${s.archived ? "archived" : ""}`} onClick={() => setStudentId(s.id)}>
                <input type="checkbox" checked={selectedIds.includes(s.id)} onClick={e => e.stopPropagation()} onChange={() => toggleSelected(s.id)} aria-label={`Select ${fullName(s)}`} />
                <div className="avatar">{s.firstName[0]}{s.lastName[0]}</div>
                <div className="student-summary"><b className="sensitive">{fullName(s)}</b><span className="sensitive">{s.email || "No email"}</span></div>
                <span className="record-count">{count}</span>
              </article>;
            })}
          </div>
          <div className="roster-foot"><button onClick={() => setShowArchived(x => !x)}>{showArchived ? "Hide archived" : "Show archived"}</button><button onClick={() => { if (selectedStudent) copy(selectedStudent.email, "Email address copied"); }} disabled={!selectedStudent?.email}>Copy current email</button></div>
        </aside>

        <section className="record-panel glass">
          {selectedStudent ? <>
            <div className="student-hero">
              <div className="hero-identity"><div className="large-avatar">{selectedStudent.firstName[0]}{selectedStudent.lastName[0]}</div><div><span className="eyebrow">STUDENT PROFILE</span><h2 className="sensitive">{fullName(selectedStudent)}</h2><button className="email-link sensitive" onClick={() => copy(selectedStudent.email, "Email address copied")}>{selectedStudent.email || "Add email address"} <span>â–¡</span></button></div></div>
              <div className="hero-actions"><button className="btn ghost" onClick={() => { update(d => ({ ...d, students: d.students.map(s => s.id === studentId ? { ...s, archived: !s.archived } : s) })); notify(selectedStudent.archived ? "Student restored to active roster" : "Student archived"); }}>{selectedStudent.archived ? "Restore" : "Archive"}</button><button className="btn ghost" onClick={() => setModal("move")}>Switch section</button><button className="btn primary" onClick={() => setModal("record")}>+ Add record</button></div>
            </div>

            <div className="insight-strip">
              <div><b>{data.records.filter(r => r.studentId === studentId).length}</b><span>Total records</span></div>
              <div><b>{data.records.filter(r => r.studentId === studentId && r.kind === "writing").length}</b><span>Writing notes</span></div>
              <div><b>{data.records.filter(r => r.studentId === studentId && r.kind === "discussion").length}</b><span>Discussion notes</span></div>
              <div><b>{data.records.filter(r => r.studentId === studentId && r.pinned).length}</b><span>Follow-ups</span></div>
            </div>

            <div className="record-tools">
              <div className="scope-toggle"><button className={historyScope === "year" ? "active" : ""} onClick={() => setHistoryScope("year")}>{currentYear?.label || "Current year"}</button><button className={historyScope === "all" ? "active" : ""} onClick={() => setHistoryScope("all")}>All years</button></div>
              <div className="record-search"><span>âŒ•</span><input value={recordSearch} onChange={e => setRecordSearch(e.target.value)} placeholder="Search this recordâ€¦" /></div>
              <button className="btn ghost compact" onClick={() => setModal("export")}>Copy record</button>
            </div>
            <div className="filter-chips"><button className={kindFilter === "all" ? "active" : ""} onClick={() => setKindFilter("all")}>All</button>{kinds.map(k => <button key={k.id} className={kindFilter === k.id ? "active" : ""} onClick={() => setKindFilter(k.id)}>{k.short}</button>)}</div>

            <div className="timeline">
              {!studentRecords.length && <div className="empty-records"><div className="holo-symbol">ï¼‹</div><h3>No records in this view</h3><p>Capture a quick observation, feedback, or a note for later.</p><button className="btn primary" onClick={() => setModal("record")}>Add the first record</button></div>}
              {studentRecords.map(r => <RecordCard key={r.id} record={r} onTogglePin={() => update(d => ({ ...d, records: d.records.map(x => x.id === r.id ? { ...x, pinned: !x.pinned, updatedAt: stamp() } : x) }))} onDelete={() => { if (confirm("Delete this record permanently?")) update(d => ({ ...d, records: d.records.filter(x => x.id !== r.id) })); }} />)}
            </div>
          </> : <div className="empty-student"><div className="holo-symbol">â—‡</div><span className="eyebrow">READY FOR A ROSTER</span><h2>Add your first student</h2><p>Records, feedback, and observations will appear here as a searchable timeline.</p><button className="btn primary" onClick={() => setModal("student")}>+ Add student</button></div>}
        </section>
      </section>

      <footer><span>LOW POWER MODE Â· LOCAL DATABASE</span><span>{data.records.length} records across {data.students.length} students</span></footer>

      {modal === "student" && <StudentModal data={data} sectionId={sectionId} onClose={() => setModal(null)} onSave={(student, enrollment) => { update(d => ({ ...d, students: [...d.students, student], enrollments: [...d.enrollments, enrollment] })); setStudentId(student.id); setModal(null); notify(`${fullName(student)} added`); }} />}
      {modal === "record" && selectedStudent && <RecordModal student={selectedStudent} enrollment={sectionEnrollments.find(e => e.studentId === studentId)} onClose={() => setModal(null)} onSave={record => { update(d => ({ ...d, records: [record, ...d.records] })); setModal(null); notify("Record saved"); }} />}
      {modal === "move" && <MoveModal data={data} studentIds={selectedIds.length ? selectedIds : studentId ? [studentId] : []} currentSectionId={sectionId} onClose={() => setModal(null)} onMove={(target, correction) => { update(d => moveStudents(d, selectedIds.length ? selectedIds : [studentId], sectionId, target, correction)); setSectionId(target); setSelectedIds([]); setModal(null); notify("Section placement updated"); }} />}
      {modal === "structure" && <StructureModal data={data} activeYearId={yearId} onClose={() => setModal(null)} onUpdate={update} onSelect={(y, c, s) => { setYearId(y); setCourseId(c); setSectionId(s); setModal(null); }} />}
      {modal === "export" && <ExportModal data={data} yearId={yearId} courseId={courseId} sectionId={sectionId} studentId={studentId} selectedIds={selectedIds} onClose={() => setModal(null)} notify={notify} />}
      {modal === "data" && <DataModal data={data} onClose={() => setModal(null)} onImport={incoming => { setData(incoming); setYearId(""); setCourseId(""); setSectionId(""); setStudentId(""); setModal(null); notify("Backup restored"); }} notify={notify} />}
      {modal === "themes" && <ThemeModal selected={activeTheme} onClose={() => setModal(null)} onSelect={theme => { update(d => ({ ...d, settings: { ...d.settings, theme } })); setModal(null); notify(`${themes.find(t => t.id === theme)?.label} skin applied`); }} />}
      {toast && <div className="toast" role="status"><i />{toast}</div>}
    </main>
  );
}

  const [date, setDate] = useState(isoDate()), [kind, setKind] = useState<RecordKind>("teacher-note"), [title, setTitle] = useState(""), [text, setText] = useState(""), [studentFacing, setStudentFacing] = useState(false), [pinned, setPinned] = useState(false);

function moveStudents(data: AppData, ids: string[], from: string, to: string, correction: boolean): AppData {
  const now = isoDate();
  let enrollments = data.enrollments.map(e => ids.includes(e.studentId) && e.sectionId === from && e.active ? (correction ? null : { ...e, active: false, endDate: now }) : e).filter(Boolean) as Enrollment[];
  ids.forEach(studentId => {
    const old = data.enrollments.find(e => e.studentId === studentId && e.sectionId === from && e.active);
    enrollments.push({ id: correction && old ? old.id : uid("enr"), studentId, sectionId: to, startDate: correction && old ? old.startDate : now, active: true });
  });
  return { ...data, enrollments };
}

function MoveModal({ data, studentIds, currentSectionId, onClose, onMove }: { data: AppData; studentIds: string[]; currentSectionId: string; onClose: () => void; onMove: (target: string, correction: boolean) => void }) {
  const [target, setTarget] = useState(data.sections.find(s => s.id !== currentSectionId && !s.archived)?.id || ""), [correction, setCorrection] = useState(false);
  return <ModalShell title={`Switch ${studentIds.length} student${studentIds.length === 1 ? "" : "s"}`} subtitle="SECTION PLACEMENT" onClose={onClose}><div className="modal-body"><div className="selected-names">{data.students.filter(s => studentIds.includes(s.id)).map(s => <span key={s.id}>{fullName(s)}</span>)}</div><label>Destination section<select value={target} onChange={e => setTarget(e.target.value)}>{data.sections.filter(s => s.id !== currentSectionId && !s.archived).map(s => { const c = data.courses.find(c => c.id === s.courseId), y = data.years.find(y => y.id === c?.yearId); return <option key={s.id} value={s.id}>{y?.label} Â· {c?.name} Â· {s.name}</option>; })}</select></label>
    <div className="choice-cards"><label className={!correction ? "active" : ""}><input type="radio" checked={!correction} onChange={() => setCorrection(false)} /> <b>Effective today</b><span>Keep the previous enrollment in the studentâ€™s history.</span></label><label className={correction ? "active" : ""}><input type="radio" checked={correction} onChange={() => setCorrection(true)} /> <b>Correct entire enrollment</b><span>Treat the previous section as a placement error.</span></label></div>
    <div className="modal-actions"><button className="btn ghost" onClick={onClose}>Cancel</button><button className="btn primary" disabled={!target} onClick={() => onMove(target, correction)}>Update placement</button></div></div></ModalShell>;
}

function StructureModal({ data, activeYearId, onClose, onUpdate, onSelect }: { data: AppData; activeYearId: string; onClose: () => void; onUpdate: (f: (d: AppData) => AppData) => void; onSelect: (y: string, c: string, s: string) => void }) {
  const [year, setYear] = useState(""), [course, setCourse] = useState(""), [section, setSection] = useState("");
  const addYear = () => { if (!year.trim()) return; onUpdate(d => ({ ...d, years: [...d.years, { id: uid("yr"), label: year.trim() }] })); setYear(""); };
  const addCourse = () => { if (!course.trim()) return; onUpdate(d => ({ ...d, courses: [...d.courses, { id: uid("crs"), yearId: activeYearId, name: course.trim() }] })); setCourse(""); };
  const activeCourses = data.courses.filter(c => c.yearId === activeYearId && !c.archived);
  const sectionCourse = activeCourses[0]?.id || "";
  const addSection = () => { if (!section.trim() || !sectionCourse) return; onUpdate(d => ({ ...d, sections: [...d.sections, { id: uid("sec"), courseId: sectionCourse, name: section.trim() }] })); setSection(""); };
  return <ModalShell title="Manage school structure" subtitle="YEARS Â· CLASSES Â· SECTIONS" onClose={onClose} wide><div className="structure-grid">
    <section><span className="eyebrow">SCHOOL YEARS</span><div className="structure-list">{data.years.map(y => <button key={y.id} className={y.id === activeYearId ? "active" : ""} onClick={() => { const c = data.courses.find(c => c.yearId === y.id), s = data.sections.find(s => s.courseId === c?.id); if (c && s) onSelect(y.id, c.id, s.id); }}>{y.label}<small>{data.courses.filter(c => c.yearId === y.id).length} classes</small></button>)}</div><div className="inline-add"><input value={year} onChange={e => setYear(e.target.value)} placeholder="2027â€“2028" /><button onClick={addYear}>+</button></div></section>
    <section><span className="eyebrow">CLASSES IN {data.years.find(y => y.id === activeYearId)?.label}</span><div className="structure-list">{activeCourses.map(c => <div key={c.id}><b>{c.name}</b><small>{data.sections.filter(s => s.courseId === c.id).length} sections</small></div>)}</div><div className="inline-add"><input value={course} onChange={e => setCourse(e.target.value)} placeholder="AP Literature" /><button onClick={addCourse}>+</button></div></section>
    <section><span className="eyebrow">SECTIONS</span><div className="structure-list">{activeCourses.flatMap(c => data.sections.filter(s => s.courseId === c.id).map(s => <div key={s.id}><b>{s.name}</b><small>{c.name}</small></div>))}</div><div className="inline-add"><input value={section} onChange={e => setSection(e.target.value)} placeholder="Block C" /><button onClick={addSection}>+</button></div></section>
  </div><div className="modal-actions padded"><span className="form-hint">Archiving and renaming controls can be added after the core workflow is in use.</span><button className="btn primary" onClick={onClose}>Done</button></div></ModalShell>;
}

function exportText(data: AppData, ids: string[], yearId: string, types: RecordKind[], allYears: boolean, anonymize: boolean, studentFacingOnly: boolean) {
  const year = data.years.find(y => y.id === yearId);
  return ids.map((id, i) => {
    const s = data.students.find(x => x.id === id); if (!s) return "";
    const enrollIds = new Set(data.enrollments.filter(e => e.studentId === id && data.sections.some(sec => sec.id === e.sectionId && data.courses.some(c => c.id === sec.courseId && c.yearId === yearId))).map(e => e.id));
    const records = data.records.filter(r => r.studentId === id && types.includes(r.kind) && (allYears || !!r.enrollmentId && enrollIds.has(r.enrollmentId)) && (!studentFacingOnly || r.studentFacing)).sort((a, b) => a.date.localeCompare(b.date));
    const name = anonymize ? `Student ${i + 1}` : fullName(s);
    const grouped = kinds.map(k => ({ ...k, records: records.filter(r => r.kind === k.id) })).filter(g => g.records.length);
    return [`STUDENT: ${name}`, `SCOPE: ${allYears ? "All available years" : year?.label || "Current year"}`, ...grouped.flatMap(g => ["", g.label.toUpperCase(), ...g.records.map(r => `${r.date}${r.title ? ` â€” ${r.title}` : ""}\n${r.text}`)])].join("\n");
  }).filter(Boolean).join("\n\nâ”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€\n\n");
}

function ExportModal({ data, yearId, courseId, sectionId, studentId, selectedIds, onClose, notify }: { data: AppData; yearId: string; courseId: string; sectionId: string; studentId: string; selectedIds: string[]; onClose: () => void; notify: (s: string) => void }) {
  const [scope, setScope] = useState<"student" | "selected" | "section" | "class">(selectedIds.length > 1 ? "selected" : "student"), [types, setTypes] = useState<RecordKind[]>(kinds.map(k => k.id)), [allYears, setAllYears] = useState(false), [anonymize, setAnonymize] = useState(false), [studentFacing, setStudentFacing] = useState(false), [format, setFormat] = useState<"text" | "json">("text");
  const ids = useMemo(() => {
    if (scope === "student") return studentId ? [studentId] : [];
    if (scope === "selected") return selectedIds;
    const sections = scope === "class" ? data.sections.filter(s => s.courseId === courseId).map(s => s.id) : [sectionId];
    return Array.from(new Set(data.enrollments.filter(e => sections.includes(e.sectionId) && e.active).map(e => e.studentId)));
  }, [scope, studentId, selectedIds, data, courseId, sectionId]);
  const plain = exportText(data, ids, yearId, types, allYears, anonymize, studentFacing);
  const json = JSON.stringify({ format: "teacher-records-selection", schemaVersion: 1, exportedAt: stamp(), students: data.students.filter(s => ids.includes(s.id)), records: data.records.filter(r => ids.includes(r.studentId) && types.includes(r.kind)) }, null, 2);
  const output = format === "text" ? plain : json;
  const doCopy = async () => { await navigator.clipboard.writeText(output); notify(`${ids.length} student record${ids.length === 1 ? "" : "s"} copied`); };
  return <ModalShell title="Prepare export" subtitle="CHATGPT-READY RECORDS" onClose={onClose} wide><div className="export-layout"><aside>
    <fieldset><legend>Who to include</legend><label><input type="radio" checked={scope === "student"} onChange={() => setScope("student")} /> Current student</label><label><input type="radio" checked={scope === "selected"} disabled={!selectedIds.length} onChange={() => setScope("selected")} /> Selected students ({selectedIds.length})</label><label><input type="radio" checked={scope === "section"} onChange={() => setScope("section")} /> Current section</label><label><input type="radio" checked={scope === "class"} onChange={() => setScope("class")} /> All class sections</label></fieldset>
    <fieldset><legend>Record scope</legend><label><input type="radio" checked={!allYears} onChange={() => setAllYears(false)} /> Current school year</label><label><input type="radio" checked={allYears} onChange={() => setAllYears(true)} /> All years</label></fieldset>
    <fieldset><legend>Include record types</legend>{kinds.map(k => <label key={k.id}><input type="checkbox" checked={types.includes(k.id)} onChange={e => setTypes(x => e.target.checked ? [...x, k.id] : x.filter(v => v !== k.id))} /> {k.label}</label>)}</fieldset>
    <fieldset><legend>Privacy and format</legend><label><input type="checkbox" checked={anonymize} onChange={e => setAnonymize(e.target.checked)} /> Replace names with Student 1, 2â€¦</label><label><input type="checkbox" checked={studentFacing} onChange={e => setStudentFacing(e.target.checked)} /> Student-facing entries only</label><select value={format} onChange={e => setFormat(e.target.value as "text" | "json")}><option value="text">ChatGPT-ready text</option><option value="json">Selected records as JSON</option></select></fieldset>
  </aside><section className="export-preview"><div className="preview-head"><div><span className="eyebrow">LIVE PREVIEW</span><b>{ids.length} student{ids.length === 1 ? "" : "s"} Â· {output.length.toLocaleString()} characters</b></div><button className="btn primary" disabled={!output} onClick={doCopy}>Copy to clipboard</button></div><pre>{output || "No records match this selection."}</pre></section></div></ModalShell>;
}

function DataModal({ data, onClose, onImport, notify }: { data: AppData; onClose: () => void; onImport: (d: AppData) => void; notify: (s: string) => void }) {
  const fileRef = useRef<HTMLInputElement>(null);
  const backup = JSON.stringify({ ...data, updatedAt: stamp() }, null, 2);
  const download = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([backup], { type: "application/json" })); a.download = `teacher-records-backup-${isoDate()}.json`; a.click(); URL.revokeObjectURL(a.href); notify("Complete backup downloaded"); };
  const importFile = (file?: File) => { if (!file) return; const reader = new FileReader(); reader.onload = () => { try { const parsed = JSON.parse(String(reader.result)); if (parsed.format !== "teacher-records-backup" || !Array.isArray(parsed.students) || !Array.isArray(parsed.records)) throw new Error(); if (confirm(`Restore ${parsed.students.length} students and ${parsed.records.length} records? This replaces the database currently on this device.`)) onImport(parsed); } catch { notify("That file is not a valid backup"); } }; reader.readAsText(file); };
  return <ModalShell title="Data and backups" subtitle="LOCAL STORAGE CONTROL" onClose={onClose}><div className="data-status"><div className="holo-symbol">â–£</div><div><b>Your records live only in this browser</b><p>{data.students.length} students Â· {data.records.length} records Â· updated {new Date(data.updatedAt).toLocaleString()}</p></div></div><div className="data-actions"><button className="data-action primary-data" onClick={download}><b>Download complete backup</b><span>Recommended Â· saves a dated JSON file</span></button><button className="data-action" onClick={() => { navigator.clipboard.writeText(backup); notify("Complete JSON backup copied"); }}><b>Copy backup as JSON text</b><span>Useful when file downloads are restricted</span></button><button className="data-action" onClick={() => fileRef.current?.click()}><b>Restore from JSON file</b><span>Preview and confirm before replacing data</span></button><input ref={fileRef} type="file" accept="application/json,.json" hidden onChange={e => importFile(e.target.files?.[0])} /></div><div className="backup-warning"><b>Keep a backup.</b> Browser data may be cleared by workplace IT policies or browser resets. JSON backups contain confidential student information and are not encrypted.</div><div className="modal-actions"><button className="btn primary" onClick={onClose}>Done</button></div></ModalShell>;
}

function ThemeModal({ selected, onClose, onSelect }: { selected: Theme; onClose: () => void; onSelect: (t: Theme) => void }) {
  return <ModalShell title="Choose interface skin" subtitle="STATIC Â· LOW POWER" onClose={onClose} wide><div className="theme-grid">{themes.map(t => <button key={t.id} className={`theme-card theme-${t.id} ${selected === t.id ? "selected" : ""}`} onClick={() => onSelect(t.id)}><i /><b>{t.label}</b><span>{t.sub}</span></button>)}</div></ModalShell>;
}
