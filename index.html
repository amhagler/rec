      @supports (color:color-mix(in lab, red, red)){.app-shell .form-tabs button.active{background:color-mix(in srgb,var(--accent) 9%,transparent)}
      }
      .app-shell .form-tabs button.active{box-shadow:inset 0 3px var(--accent)}
      .app-shell .key-grid{overflow:hidden}
      .app-shell .key-row{background:#ffffff04}
      .app-shell .key-row.active-question{background:var(--accent)}
      @supports (color:color-mix(in lab, red, red)){.app-shell .key-row.active-question{background:color-mix(in srgb,var(--accent) 10%,transparent)}
      }
      .app-shell .key-row.active-question{box-shadow:inset 0 0 0 2px var(--accent)}
      .app-shell .key-row button{color:var(--ui-ink);background:#ffffff08;border-color:#ffffff20;border-radius:8px}
      .app-shell .key-row button.picked{color:var(--bg0);border-color:var(--accent);background:var(--accent);box-shadow:0 0 16px var(--accent)}
      @supports (color:color-mix(in lab, red, red)){.app-shell .key-row button.picked{box-shadow:0 0 16px color-mix(in srgb,var(--accent) 25%,transparent)}

      .app-shell .bulk-entry{margin-top:12px}
      .app-shell .studio-head{border-radius:21px 21px 0 0}
      .app-shell .preview-wrap{background:#060b13aa;border:1px solid #ffffff12}
      .app-shell .how{border-left:3px solid var(--warm)}
      .app-shell .save-notice{color:var(--accent)}
      .app-shell .number-notice{color:var(--warm)}
      .app-shell .preflight ul{color:var(--muted)}
      .app-shell .preflight b{color:var(--ui-ink)}
      .app-shell .form-actions select{min-width:155px}

      .app-shell .paper h1,.app-shell .paper h2,.app-shell .paper p,.app-shell .paper span,.app-shell .paper footer{color:#000}
      .app-shell .paper .department{color:#1f4b3a}
      .app-shell .paper .answer-box{color:#000;background:#fff;border-color:#000}
      .app-shell .paper .answer-box.filled{color:#000!important;background:#000!important}
      @media print{.app-shell{color:#000!important;background:#fff!important}
      .app-shell:before{display:none}
      .app-shell .paper{box-shadow:none!important}
      }
      .app-shell input,.app-shell select,.app-shell textarea{font-size:13px;line-height:1.2}
      .app-shell .bulk-entry textarea{font:15px/1.45 ui-monospace,Consolas,monospace}

      .app-shell .form-actions select{min-width:155px;max-width:225px}
      .app-shell .studio-actions button{font-size:12px;line-height:1.2}
      .section-add{grid-template-columns:1fr auto;align-items:end;gap:8px;display:grid}
      .section-add label{margin:0!important}
      .section-add .primary{white-space:nowrap}
      .section-list{gap:8px;margin:12px 0 20px;display:grid}
      .section-list>div{grid-template-columns:minmax(0,1fr) 82px auto;align-items:center;gap:6px;display:grid}
      .section-list>div>input{min-width:0}
      .section-list label{grid-template-columns:auto 1fr;align-items:center;gap:4px;margin:0!important;display:grid!important}
      .section-list label input{width:48px!important;margin:0!important;padding:7px!important}
      .section-list .ghost{padding:9px}
      .inline-section-editor{border-top:1px solid color-mix(in srgb,var(--muted) 22%,transparent);width:100%;margin-top:8px;padding-top:12px}
      .inline-section-add{grid-template-columns:minmax(120px,1fr) 105px auto;align-items:end;gap:7px;margin-top:8px;display:grid}
      .inline-section-add label{margin:0!important}
